<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Greenhouse fixture</title></head>
  <body>
    <h1>Apply for this job</h1>
    <form id="application-form" action="/applications">
      <label for="first_name">First Name *</label>
      <input id="first_name" name="job_application[first_name]" type="text" required />

      <label for="last_name">Last Name *</label>
      <input id="last_name" name="job_application[last_name]" type="text" required />

      <label for="email">Email *</label>
      <input id="email" name="job_application[email]" type="email" required />

      <label for="phone">Phone</label>
      <input id="phone" name="job_application[phone]" type="tel" />

      <label for="resume">Resume/CV *</label>
      <input id="resume" name="resume" type="file" required />

      <label for="auth">Are you legally authorized to work in the US? *</label>
      <select id="auth" name="question_auth" required>
        <option value="">Please select</option>
        <option>Yes</option>
        <option>No</option>
      </select>

      <label for="why">Why do you want to work here? *</label>
      <textarea id="why" name="question_why" required></textarea>

      <button type="submit" id="submit_app">Submit Application</button>
    </form>
  </body>
</html>
