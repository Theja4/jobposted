<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Lever fixture</title></head>
  <body>
    <h2>Submit your application</h2>
    <form class="application-form">
      <label>Full name<input name="name" type="text" required /></label>
      <label>Email<input name="email" type="email" required /></label>
      <label>Phone<input name="phone" type="tel" /></label>
      <label>LinkedIn URL<input name="urls[LinkedIn]" type="url" /></label>
      <label>GitHub / Portfolio<input name="urls[Portfolio]" type="url" /></label>
      <label>Resume<input name="resume" type="file" required /></label>
      <label>Years of experience
        <select name="exp" required>
          <option value="">Select…</option>
          <option>1-3 years</option>
          <option>3-5 years</option>
          <option>5+ years</option>
        </select>
      </label>
      <label>Why do you want to join us?<textarea name="why" required></textarea></label>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
