<!doctype html>
<form data-automation-id="workdayApplication">
  <h2 data-automation-id="stepName">My Information</h2>
  <div data-automation-id="legalNameSection_firstName">
    <label for="wd-first">Legal First Name</label>
    <input id="wd-first" />
  </div>
  <div data-automation-id="legalNameSection_lastName">
    <label for="wd-last">Legal Last Name</label>
    <input id="wd-last" />
  </div>
  <div data-automation-id="email">
    <label for="wd-email">Email Address</label>
    <input id="wd-email" type="email" />
  </div>
  <div data-automation-id="countryDropdown">
    <label for="wd-country">Country</label>
    <button id="wd-country" type="button" aria-haspopup="listbox" aria-controls="wd-country-list">Select One</button>
    <ul id="wd-country-list" role="listbox">
      <li role="option">United States of America</li>
      <li role="option">India</li>
    </ul>
  </div>
  <div data-automation-id="resumeUpload">
    <label for="wd-resume">Resume/CV</label>
    <input id="wd-resume" type="file" />
  </div>
  <button type="button">Save and Continue</button>
</form>
