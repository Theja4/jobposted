<!doctype html>
<form data-testid="CandidateApplicationForm">
  <label for="ashby-first">First name</label>
  <input id="ashby-first" name="firstName" />
  <label for="ashby-last">Last name</label>
  <input id="ashby-last" name="lastName" />
  <label for="ashby-email">Email</label>
  <input id="ashby-email" name="email" type="email" />
  <label for="ashby-phone">Phone</label>
  <input id="ashby-phone" name="phone" type="tel" />
  <label for="ashby-resume">Resume</label>
  <input id="ashby-resume" type="file" name="resume" />
  <button>Submit Application</button>
</form>
