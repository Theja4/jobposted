<!doctype html>
<form>
  <fieldset>
    <legend>Contact information</legend>
    <label for="given">Given name *</label>
    <input id="given" required />
    <label for="family">Family name *</label>
    <input id="family" required />
    <label for="mail">Your email</label>
    <input id="mail" type="email" />
  </fieldset>
  <fieldset>
    <legend>Application questions</legend>
    <label for="sponsor">Will you now or in the future require visa sponsorship?</label>
    <select id="sponsor">
      <option></option>
      <option>Yes</option>
      <option>No</option>
    </select>
    <fieldset>
      <legend>Are you authorized to work in the country?</legend>
      <label><input type="radio" name="auth" value="yes" /> Yes</label>
      <label><input type="radio" name="auth" value="no" /> No</label>
    </fieldset>
    <label for="why">Why are you interested in this company?</label>
    <textarea id="why"></textarea>
  </fieldset>
</form>
